[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goalreel"
version = "2.4.0"
description = "Evidence-constrained football virtual cinema engine + AI Football Reel Studio (ComfyUI + Wan 2.2 TI2V 5B)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "scipy>=1.10",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "torch>=2.1",
  "torchvision>=0.16",
  # Reel Studio (FastAPI + ComfyUI client)
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "Pillow>=10.0"
]

[project.optional-dependencies]
dev=["pytest>=8.0"]
# NOTE: reid utilise une architecture OSNet VENDORISÉE (vendor/osnet) —
# torchreid n'est plus nécessaire. depth utilise un code Depth-Anything-V2
# VENDORISÉ (vendor/depth_anything_v2) — timm n'est plus nécessaire.
yolo=["ultralytics>=8.3"]
ocr=["easyocr>=1.7"]
# NOTE: l'extra `sam2` doit respecter PEP 508 (chemin VCS *nommé*). Un
# `git+https://...` nu n'est pas un requirement valide et casse `pip install -e`.
# Le paquet VCS s'appelle « SAM-2 » ; on le référence donc explicitement.
sam2=["SAM-2 @ git+https://github.com/facebookresearch/sam2.git"]
# Novel-view (caméra virtuelle) : installer depuis third_party/stable-virtual-camera
# seva=["-e", "third_party/stable-virtual-camera"]

[tool.pytest.ini_options]
pythonpath=["."]

# Découverte explicite des paquets : le dépôt a plusieurs répertoires de
# premier niveau (assets, models, vendor, third_party, web, ...) qui ne sont
# PAS des paquets Python. Sans ce bloc, setuptools échoue en « flat-layout »
# et `pip install -e .` ne peut pas aboutir.
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["goalreel*"]
exclude = ["tests*", "web*", "vendor*", "third_party*", "models*", "assets*",
           "checkpoints*", "outputs*", "docs*", "scripts*"]
