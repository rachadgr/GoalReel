[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goalreel"
version = "1.0.0"
description = "Evidence-constrained football virtual cinema engine"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "scipy>=1.10",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "torch>=2.1",
  "torchvision>=0.16"
]

[project.optional-dependencies]
dev=["pytest>=8.0"]
# NOTE: reid utilise une architecture OSNet VENDORISÉE (vendor/osnet) —
# torchreid n'est plus nécessaire. depth utilise un code Depth-Anything-V2
# VENDORISÉ (vendor/depth_anything_v2) — timm n'est plus nécessaire.
yolo=["ultralytics>=8.3"]
ocr=["easyocr>=1.7"]
sam2=["git+https://github.com/facebookresearch/sam2.git"]
# Novel-view (caméra virtuelle) : installer depuis third_party/stable-virtual-camera
# seva=["-e", "third_party/stable-virtual-camera"]

[tool.pytest.ini_options]
pythonpath=["."]
